services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company
      POSTGRES_DB: company_access
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d company_access"]
      interval: 5s
      retries: 10
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company
      POSTGRES_DB: company_access_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres_data:
