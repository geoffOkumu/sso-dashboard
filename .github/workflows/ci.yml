name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: permitkit
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: permitkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U permitkit -d permitkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://permitkit:local-ci-only@localhost:5432/permitkit_test
      TEST_DATABASE_URL: postgresql://permitkit:local-ci-only@localhost:5432/permitkit_test
      BETTER_AUTH_URL: https://identity.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0
      - name: Generate ephemeral authentication secret
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "BETTER_AUTH_SECRET=" + require("node:crypto").randomBytes(48).toString("base64url") + "\n")'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      # Traces and screenshots may contain credentials; do not upload by default.
