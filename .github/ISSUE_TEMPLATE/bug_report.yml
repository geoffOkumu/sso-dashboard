name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow [SECURITY.md](https://github.com/geoffOkumu/sso-dashboard/blob/HEAD/SECURITY.md). Do not include credentials, tokens, invitation links, recovery codes, or real employee data.
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Commit or release, Node and pnpm versions, OS, browser, and PostgreSQL version. Do not paste environment files.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal example with synthetic accounts and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized errors or screenshots if useful.
    validations:
      required: true
